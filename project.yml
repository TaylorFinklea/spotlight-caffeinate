name: SpotlightCaffeinate
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 12
targets:
  SpotlightCaffeinate:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    dependencies:
      - target: SpotlightCaffeinateCLI
    sources:
      - path: SpotlightCaffeinate
    postBuildScripts:
      - name: Embed Bundled CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cli_source="${BUILT_PRODUCTS_DIR}/spotlight-caffeinate-cli"
          cli_directory="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/cli"
          duplicate_root_cli="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/spotlight-caffeinate-cli"

          if [[ ! -x "$cli_source" ]]; then
            echo "Expected CLI binary at $cli_source" >&2
            exit 1
          fi

          install -d "$cli_directory"
          rm -f "$duplicate_root_cli"
          install -m 755 "$cli_source" "$cli_directory/spotlight-caffeinate-cli"
          ln -sf "spotlight-caffeinate-cli" "$cli_directory/caf"
          install -m 755 "$SRCROOT/scripts/install_cli_from_app_bundle.sh" "$cli_directory/install-cli.sh"

          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              --entitlements "$SRCROOT/SpotlightCaffeinateCLI/SpotlightCaffeinateCLI.entitlements" \
              --timestamp=none \
              "$cli_directory/spotlight-caffeinate-cli"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.spotlightcaffeinate
        PRODUCT_NAME: Spotlight Caffeinate
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpotlightCaffeinate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SpotlightCaffeinate/SpotlightCaffeinate.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K7CBQW6MPG
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: SpotlightCaffeinate/Info.plist
      properties:
        CFBundleDisplayName: Spotlight Caffeinate
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "12"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSCalendarsFullAccessUsageDescription: Spotlight Caffeinate uses Calendar access only for optional calendar-based automations.
        NSSupportsAutomaticGraphicsSwitching: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - SpotlightCaffeinateTests
  SpotlightCaffeinateCLI:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SpotlightCaffeinateCLI
      - path: SpotlightCaffeinate/Models
      - path: SpotlightCaffeinate/Support
      - path: SpotlightCaffeinate/Services
    settings:
      base:
        PRODUCT_NAME: spotlight-caffeinate-cli
        PRODUCT_BUNDLE_IDENTIFIER: dev.finklea.spotlightcaffeinate.cli
        CODE_SIGN_ENTITLEMENTS: SpotlightCaffeinateCLI/SpotlightCaffeinateCLI.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K7CBQW6MPG
    scheme:
      gatherCoverageData: false
  SpotlightCaffeinateTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    dependencies:
      - target: SpotlightCaffeinateCLI
        link: false
    sources:
      - path: SpotlightCaffeinateTests
      - path: SpotlightCaffeinate/Models
      - path: SpotlightCaffeinate/Support
      - path: SpotlightCaffeinate/Services
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
